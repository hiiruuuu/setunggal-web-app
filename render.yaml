services:
  - type: web
    name: setunggal-web-app
    env: php
    region: singapore
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader && npm install && npm run build && php artisan storage:link"
    startCommand: "php artisan config:cache && php artisan route:cache && php artisan migrate --force && vendor/bin/heroku-php-apache2 public/"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: sqlite
